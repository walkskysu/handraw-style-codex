name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and catalog
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm.cmd ci

      - name: Check release version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Git tag must match the version in tauri.conf.json"
          }

      - name: Run frontend tests
        run: npm.cmd test

      - name: Install browser for layout tests
        run: npx.cmd playwright install --no-shell chromium

      - name: Run layout tests
        run: npm.cmd run test:layout

      - name: Run Rust tests
        run: npm.cmd run test:rust

      - name: Build, sign and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Handraw ${{ github.ref_name }}
          releaseBody: |
            Windows x64 安装包。
            下载 setup.exe 后安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles nsis