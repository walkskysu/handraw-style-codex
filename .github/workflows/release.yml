name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Download pinned handraw-style catalog
        shell: pwsh
        run: |
          # 读取主项目锁定的子模块提交，不下载上游最新版本
          $entry = git ls-tree HEAD -- handraw-style
          if ($LASTEXITCODE -ne 0 -or
              $entry -notmatch '^160000 commit ([0-9a-f]{40})\s') {
            throw "Cannot determine pinned handraw-style commit"
          }
          $commit = $Matches[1]
          Write-Host "Catalog commit: $commit"

          $archive = Join-Path $env:RUNNER_TEMP "handraw-style.zip"
          $extract = Join-Path $env:RUNNER_TEMP "handraw-style-extracted"

          Invoke-WebRequest `
            -Uri "https://github.com/yang0/handraw-style/archive/$commit.zip" `
            -OutFile $archive

          Expand-Archive -LiteralPath $archive -DestinationPath $extract

          $source = Join-Path $extract "handraw-style-$commit"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Extracted catalog directory not found"
          }

          New-Item -ItemType Directory -Force handraw-style | Out-Null

          Get-ChildItem -LiteralPath $source -Force |
            Copy-Item -Destination handraw-style -Recurse -Force

          if (-not (Test-Path handraw-style/images)) {
            throw "Catalog images are missing"
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm.cmd ci

      - name: Check release version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Git tag must match the version in tauri.conf.json"
          }

      - name: Run frontend tests
        run: npm.cmd test

      - name: Install browser for layout tests
        run: npx.cmd playwright install --no-shell chromium

      - name: Run layout tests
        run: npm.cmd run test:layout

      - name: Run Rust tests
        run: npm.cmd run test:rust

      - name: Build, sign and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Handraw ${{ github.ref_name }}
          releaseBody: |
            Windows x64 安装包。
            下载 setup.exe 后安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles nsis