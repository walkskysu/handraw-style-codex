name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        run: npm.cmd ci
      - name: Test Vue components and IPC adapter
        run: npm.cmd test
      - name: Typecheck and build frontend
        run: npm.cmd run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test Rust commands
        run: npm.cmd run test:rust
      - name: Build Windows desktop application
        run: npm.cmd run tauri -- build --debug --no-bundle
